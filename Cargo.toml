[package]
name = "beacon"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures = { version = "0.3.34", features = ["futures-executor", "std"] }
futures-executor = "0.3.34"
futures-timer = "3.0.4"
notify = { version = "8.2.1", features = ["kqueue", "macos_kqueue"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.149"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "=0.3.23"
