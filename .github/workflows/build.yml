name: Beacon Actions
run-name: CI process for Beacon
on:
  release:
    types:
      - published
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: linux-x86_64
            output: default
          - name: linux-arm64
            output: aarch64-linux
          - name: windows-x86_64
            output: x86_64-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Build target (${{ matrix.target.name }})
        run: |
          nix build .#${{ matrix.target.output }} --print-build-logs
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beacon-${{ matrix.target.name }}
          path: result/bin/*
