name: Beacon Actions
run-name: CI process for Beacon
on:
  release:
    types:
      - published
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: linux-x86_64
            output: x86_64-musl
            binary: beacon
            asset: beacon-linux-x86_64
          - name: linux-arm64
            output: aarch64-linux
            binary: beacon
            asset: beacon-linux-arm64
          - name: windows-x86_64
            output: x86_64-windows
            binary: beacon.exe
            asset: beacon-windows-x86_64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Build target (${{ matrix.target.name }})
        run: |
          nix build .#${{ matrix.target.output }} --print-build-logs
      - name: Prepare release asset
        run: cp "result/bin/${{ matrix.target.binary }}" "${{ matrix.target.asset }}"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beacon-${{ matrix.target.name }}
          path: ${{ matrix.target.asset }}
      - name: Add asset to release
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.target.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
